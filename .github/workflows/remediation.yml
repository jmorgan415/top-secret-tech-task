name: Vulnerability Remediation

on:
  # Path-filtered so this doesn't run on every commit to main.
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "src/**"
  # Manual button in the Actions tab, for demos and ad-hoc runs.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    uses: jmorgan415/remediation-platform/.github/workflows/remediate.yml@main
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

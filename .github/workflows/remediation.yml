name: Vulnerability Remediation

on:
  # New CVEs get disclosed against dependencies you already have, independent of
  # any code change -- a schedule is what actually catches those.
  schedule:
    - cron: "0 6 * * *"
  # Cheap immediate feedback for the moments the dependency/build surface itself
  # changes. Path-filtered so this doesn't run on every commit to main.
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "src/**"
  # Manual button in the Actions tab, for demos and ad-hoc runs.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm install

      - name: Install remediation-agent dependencies
        working-directory: remediation-agent
        run: npm install

      - name: Configure git identity for the pipeline's own commits
        run: |
          git config user.name "remediation-bot"
          git config user.email "remediation-bot@users.noreply.github.com"

      - name: Run remediation pipeline
        working-directory: remediation-agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: npm run remediate

      - name: Push the remediation branch and open a draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: remediation-agent
        run: |
          REPORT=$(ls -t reports/*.json 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "No report was written; the pipeline didn't get far enough to produce one."
            exit 0
          fi

          BRANCH=$(node -e "console.log(require('./' + process.argv[1]).branch ?? '')" "$REPORT")
          if [ -z "$BRANCH" ]; then
            echo "No fix branch was created (nothing was fixable this run)."
            exit 0
          fi

          AHEAD=$(git rev-list --count main.."$BRANCH")
          if [ "$AHEAD" -eq "0" ]; then
            echo "Fix branch has no commits ahead of main; nothing to open a PR for."
            exit 0
          fi

          git push origin "$BRANCH"
          # Always opened as a draft -- this pipeline's own auto-fix/draft-for-review
          # split is a local policy decision, not a signal for whether CI should
          # auto-merge. A human reviews and merges every remediation PR, no exceptions.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "Automated remediation: $BRANCH" \
            --body "Opened automatically by the remediation pipeline. Each commit is independently reviewable and tagged [auto-fix] or [draft-for-review] in its message -- some resources may show both a fix commit and an immediate revert commit, which means verification caught a fix that didn't actually resolve its finding. See the attached report artifact for full per-resource reasoning."

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-report
          path: remediation-agent/reports/
